name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push replaces a build that is still running, except on a release tag.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FOTOGRAMMA_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  build-linux:
    name: Test & build linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm cmake patchelf \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            mesa-vulkan-drivers libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev

      - name: Cache minimal FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deployment/vendor/rust/Linux-x86_64
          key: ffmpeg-linux-${{ hashFiles('deployment/ffmpeg/**') }}

      - name: Build minimal FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: deployment/ffmpeg/build_minimal.sh

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Verify the packaged media toolchain
        env:
          FOTOGRAMMA_FFMPEG_DIR: ${{ github.workspace }}/deployment/vendor/rust/Linux-x86_64/bin
        run: cargo test -p fotogramma-core --test conversion_pipeline --locked

      - name: Build portable app
        run: python3 deployment/build_rust.py

      - name: Scan with the bundled tools and a clean PATH
        run: |
          set -euo pipefail
          mkdir -p /tmp/fotogramma-media
          head -c 30720 /dev/zero > /tmp/fotogramma-media/source.yuv
          deployment/vendor/rust/Linux-x86_64/bin/ffmpeg -y -hide_banner -loglevel error \
            -f rawvideo -pixel_format yuv420p -video_size 64x64 -framerate 5 \
            -i /tmp/fotogramma-media/source.yuv -c:v mpeg4 \
            /tmp/fotogramma-media/clip.mp4
          cargo build --release --locked -p fotogramma-core --example scan
          env -i PATH=/usr/bin:/bin \
            FOTOGRAMMA_FFMPEG_DIR="$PWD/dist/Fotogramma/bin" \
            target/release/examples/scan /tmp/fotogramma-media

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshots-linux
          path: crates/app/tests/snapshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fotogramma-linux
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Test & build macOS ARM
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Install FFmpeg dependencies
        run: brew install x265 pkgconf

      - name: Build minimal FFmpeg
        run: deployment/ffmpeg/build_minimal.sh

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Verify the packaged media toolchain
        env:
          FOTOGRAMMA_FFMPEG_DIR: ${{ github.workspace }}/deployment/vendor/rust/Darwin-arm64/bin
        run: cargo test -p fotogramma-core --test conversion_pipeline --locked

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/pip" install dmgbuild

      - name: Build portable app and disk image
        env:
          FOTOGRAMMA_REQUIRE_DMG: "1"
        run: '"$RUNNER_TEMP/dmg-venv/bin/python" deployment/build_rust.py'

      - name: Scan with the bundled tools and a clean PATH
        run: |
          set -euo pipefail
          mkdir -p /tmp/fotogramma-media
          head -c 30720 /dev/zero > /tmp/fotogramma-media/source.yuv
          deployment/vendor/rust/Darwin-arm64/bin/ffmpeg -y -hide_banner -loglevel error \
            -f rawvideo -pixel_format yuv420p -video_size 64x64 -framerate 5 \
            -i /tmp/fotogramma-media/source.yuv -c:v mpeg4 \
            /tmp/fotogramma-media/clip.mp4
          cargo build --release --locked -p fotogramma-core --example scan
          env -i PATH=/usr/bin:/bin HOME="$HOME" \
            FOTOGRAMMA_FFMPEG_DIR="$PWD/dist/Fotogramma.app/Contents/Resources/bin" \
            target/release/examples/scan /tmp/fotogramma-media

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshots-macos
          path: crates/app/tests/snapshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ZIP and DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fotogramma-macos-arm
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Test & build windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            curl
            git
            cmake
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf

      - name: Cache minimal FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deployment/vendor/rust/Windows-amd64
          key: ffmpeg-windows-${{ hashFiles('deployment/ffmpeg/**') }}

      - name: Build minimal FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: deployment/ffmpeg/build_minimal_windows.sh

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build portable app
        run: python deployment/build_rust.py

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshots-windows
          path: crates/app/tests/snapshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fotogramma-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Setup Python for release
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Test the release uploader
        run: python -m unittest tests.test_create_release

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python deployment/create_release.py release-assets
