name: Build & Release

on:
  push:
    branches: [main, rust-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FOTOGRAMMA_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  build-linux:
    name: Test & build linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm patchelf libx265-dev \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev

      - name: Build minimal FFmpeg
        run: deployment/ffmpeg/build_minimal.sh

      - name: Run tests
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Verify the packaged media toolchain
        working-directory: rust
        env:
          FOTOGRAMMA_FFMPEG_DIR: ${{ github.workspace }}/deployment/vendor/rust/Linux-x86_64/bin
        run: cargo test -p fotogramma-core --test conversion_pipeline --locked

      - name: Build portable app
        run: python3 deployment/build_rust.py

      - name: Scan with the bundled tools and a clean PATH
        run: |
          set -euo pipefail
          mkdir -p /tmp/fotogramma-media
          head -c 30720 /dev/zero > /tmp/fotogramma-media/source.yuv
          deployment/vendor/rust/Linux-x86_64/bin/ffmpeg -y -hide_banner -loglevel error \
            -f rawvideo -pixel_format yuv420p -video_size 64x64 -framerate 5 \
            -i /tmp/fotogramma-media/source.yuv -c:v mpeg4 \
            /tmp/fotogramma-media/clip.mp4
          cargo build --release --locked -p fotogramma-core --example scan --manifest-path rust/Cargo.toml
          env -i PATH=/usr/bin:/bin \
            FOTOGRAMMA_FFMPEG_DIR="$PWD/dist/Fotogramma/bin" \
            rust/target/release/examples/scan /tmp/fotogramma-media

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fotogramma-linux
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Test & build macOS ARM
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install FFmpeg dependencies
        run: brew install x265 pkgconf

      - name: Build minimal FFmpeg
        run: deployment/ffmpeg/build_minimal.sh

      - name: Run tests
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Verify the packaged media toolchain
        working-directory: rust
        env:
          FOTOGRAMMA_FFMPEG_DIR: ${{ github.workspace }}/deployment/vendor/rust/Darwin-arm64/bin
        run: cargo test -p fotogramma-core --test conversion_pipeline --locked

      - name: Build portable app
        run: python3 deployment/build_rust.py

      - name: Scan with the bundled tools and a clean PATH
        run: |
          set -euo pipefail
          mkdir -p /tmp/fotogramma-media
          head -c 30720 /dev/zero > /tmp/fotogramma-media/source.yuv
          deployment/vendor/rust/Darwin-arm64/bin/ffmpeg -y -hide_banner -loglevel error \
            -f rawvideo -pixel_format yuv420p -video_size 64x64 -framerate 5 \
            -i /tmp/fotogramma-media/source.yuv -c:v mpeg4 \
            /tmp/fotogramma-media/clip.mp4
          cargo build --release --locked -p fotogramma-core --example scan --manifest-path rust/Cargo.toml
          env -i PATH=/usr/bin:/bin HOME="$HOME" \
            FOTOGRAMMA_FFMPEG_DIR="$PWD/dist/Fotogramma.app/Contents/Resources/bin" \
            rust/target/release/examples/scan /tmp/fotogramma-media

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fotogramma-macos-arm
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Test & build windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            curl
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-x265

      - name: Build minimal FFmpeg
        shell: msys2 {0}
        run: deployment/ffmpeg/build_minimal_windows.sh

      - name: Run tests
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Build portable app
        run: python deployment/build_rust.py

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fotogramma-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Setup Python for release
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python deployment/create_release.py release-assets
