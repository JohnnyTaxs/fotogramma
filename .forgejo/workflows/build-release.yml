name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test & build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: windows-latest, label: windows }
          - { os: macos-15, label: macos-arm }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install FFmpeg (macOS ARM only)
        if: matrix.os == 'macos-15'
        run: brew install ffmpeg || brew upgrade ffmpeg

      - name: Run tests
        run: uv run --no-project --with pyside6-essentials python -m unittest discover -s tests -q

      - name: Build portable app
        run: uv run --no-project --with pyside6-essentials --with pyinstaller==6.22.3 python deployment/build.py

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fotogramma-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Forgejo: grant release upload rights through Authorized Integrations.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update Forgejo release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python deployment/create_release.py release-assets
