[package]
name = "fotogramma-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Video discovery, probing, conversion and verification for Fotogramma"

[[bin]]
name = "fotogramma-cli"
path = "src/bin/fotogramma-cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
